<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Fraunces:ital,wght@0,300;0,600;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/main.css"/>
  <link rel="stylesheet" href="css/themes.css"/>
  <link rel="stylesheet" href="css/components.css"/>
</head>
<body>

  <!-- ═══ AUTH SCREEN ══════════════════════════════════════════════ -->
  <div id="auth-screen" class="auth-bg">
    <div class="auth-card glass">
      <div class="auth-logo">📅</div>
      <h1 class="auth-title" id="auth-heading">Willkommen zurück</h1>
      <p class="auth-sub" id="auth-sub">Melde dich an, um deinen Kalender zu öffnen</p>

      <div class="field-group">
        <label class="field-label">E-Mail</label>
        <input id="auth-email" type="email" class="field-input" placeholder="deine@email.de"/>
      </div>
      <div class="field-group">
        <label class="field-label">Passwort</label>
        <input id="auth-password" type="password" class="field-input" placeholder="Dein Passwort"/>
      </div>

      <div id="auth-error" class="auth-error hidden"></div>

      <button id="auth-submit" class="btn btn-primary btn-full">Anmelden</button>

      <p class="auth-switch">
        <span id="auth-switch-text">Noch kein Konto?</span>
        <a id="auth-switch-link" href="#" onclick="return false">Registrieren</a>
      </p>
      <div class="auth-divider"></div>
      <button id="auth-demo" class="btn btn-ghost btn-full">Demo-Modus (ohne Login)</button>
    </div>
  </div>

  <!-- ═══ APP ═══════════════════════════════════════════════════════ -->
  <div id="app" class="hidden">

    <!-- TOP BAR -->
    <header id="topbar" class="topbar glass">
      <div class="topbar-left">
        <span class="app-logo">📅 <span class="app-name">Kalender</span></span>
        <div class="nav-group">
          <button id="btn-prev" class="btn-nav" title="Zurück">‹</button>
          <button id="btn-today" class="btn-chip">Heute</button>
          <button id="btn-next" class="btn-nav" title="Vor">›</button>
          <h2 id="header-label" class="header-label"></h2>
        </div>
      </div>
      <div class="topbar-right">
        <div class="view-switcher" id="view-switcher">
          <button data-view="month" class="view-btn active">Monat</button>
          <button data-view="week"  class="view-btn">Woche</button>
          <button data-view="day"   class="view-btn">Tag</button>
        </div>
        <button id="btn-goto"     class="icon-btn" title="Gehe zu Datum">🔍</button>
        <button id="btn-add"      class="btn btn-primary">+ Ereignis</button>
        <button id="btn-refresh" class="icon-btn" title="Aktualisieren">🔄</button>
        <button id="btn-settings" class="icon-btn" title="Einstellungen">⚙️</button>
        <div class="user-chip" id="user-chip">
          <div class="user-avatar" id="user-avatar">?</div>
          <button id="btn-logout" class="btn-logout">Abmelden</button>
        </div>
      </div>
    </header>

    <!-- CALENDAR BODY -->
    <main id="main" class="main-content">
      <!-- injected by calendar.js -->
    </main>

  </div><!-- /#app -->

  <!-- ═══ MODALS ════════════════════════════════════════════════════ -->

  <!-- EVENT MODAL -->
  <div id="modal-event" class="overlay hidden">
    <div class="modal glass">
      <div class="modal-header">
        <h3 id="modal-event-title" class="modal-title">Neues Ereignis</h3>
        <button class="modal-close" data-close="modal-event">×</button>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label class="field-label">Titel *</label>
          <input id="ev-title" type="text" class="field-input" placeholder="Ereignistitel…"/>
        </div>
        <div class="field-row">
          <div class="field-group">
            <label class="field-label">Von</label>
            <input id="ev-from" type="time" class="field-input"/>
          </div>
          <div class="field-group">
            <label class="field-label">Bis</label>
            <input id="ev-to" type="time" class="field-input"/>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label">Datum</label>
          <input id="ev-date" type="date" class="field-input"/>
        </div>
        <div class="field-group">
          <label class="field-label">Standort</label>
          <input id="ev-location" type="text" class="field-input" placeholder="Ort oder Adresse…"/>
        </div>
        <div class="field-group">
          <label class="field-label">Notizen</label>
          <textarea id="ev-notes" class="field-input field-textarea" placeholder="Notizen…"></textarea>
        </div>
        <div class="field-group">
          <label class="field-label">Farbe</label>
          <div id="ev-color-picker" class="color-picker"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="ev-delete" class="btn btn-danger hidden">Löschen</button>
        <div class="modal-footer-right">
          <button class="btn btn-ghost" data-close="modal-event">Abbrechen</button>
          <button id="ev-save" class="btn btn-primary">Speichern</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="modal-settings" class="overlay hidden">
    <div class="modal glass modal-sm">
      <div class="modal-header">
        <h3 class="modal-title">Einstellungen</h3>
        <button class="modal-close" data-close="modal-settings">×</button>
      </div>
      <div class="modal-body">
        <div class="setting-row">
          <div>
            <div class="setting-label">Erscheinungsbild</div>
            <div class="setting-sub" id="theme-mode-label">Hell</div>
          </div>
          <div class="toggle" id="dark-toggle"><div class="toggle-knob"></div></div>
        </div>
        <div class="setting-section-title">Farbdesign</div>
        <div id="color-theme-grid" class="color-theme-grid"></div>
        <div class="setting-row">
          <div>
            <div class="setting-label">Benachrichtigungen</div>
            <div class="setting-sub" id="notif-status">Nicht aktiviert</div>
          </div>
          <button id="btn-notif" class="btn btn-chip">Aktivieren</button>
        </div>
        <div class="setting-info">
          💡 Für echtes Supabase: URL + Anon Key in <code>js/auth.js</code> eintragen.
        </div>
      </div>
    </div>
  </div>

  <!-- GOTO MODAL -->
  <div id="modal-goto" class="overlay hidden">
    <div class="modal glass modal-xs">
      <div class="modal-header">
        <h3 class="modal-title">Gehe zu Datum</h3>
        <button class="modal-close" data-close="modal-goto">×</button>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label class="field-label">Datum</label>
          <input id="goto-date" type="date" class="field-input"/>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close="modal-goto">Abbrechen</button>
        <button id="btn-goto-go" class="btn btn-primary">Springen</button>
      </div>
    </div>
  </div>

  <!-- ═══ SCRIPTS ═══════════════════════════════════════════════════ -->
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<!-- ... rest bleibt wie gehabt -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/themes.js"></script>
  <script src="js/events.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
